name: CI

on:
  push:
    branches: [main, staging, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and schema check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waleado_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/waleado_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/waleado_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (app and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Tests
        run: npm test

      # Fails when schema.prisma has changes no migration creates (a fresh install, e.g. staging,
      # would be missing those tables or columns).
      - name: Migrations match schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code --script
